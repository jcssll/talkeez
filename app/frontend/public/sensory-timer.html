<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensory Timer — Talkeez</title><meta name="description" content="Accessible tools for communication, learning, and everyday life from Talkeez."><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/headquarters.css"></head><body><a class="skip-link" href="#main">Skip to content</a><div data-mount="nav"></div><main id="main"><section class="container tool-page"><div class="tool-heading"><div><p class="eyebrow">TALKEEZ SENSORY TIMER</p><h1>Time, at your pace.</h1><p>A gentle visual countdown for the next part of your day.</p></div><button class="btn btn-outline" id="fullscreen">Classroom fullscreen</button></div><div class="timer-layout"><section class="timer-stage" id="timer-stage"><p id="activity-display">Quiet break</p><div class="timer-ring" id="ring"><div><output id="countdown" aria-label="Time remaining">05:00</output><p id="timer-state" role="status">Ready when you are</p></div></div><div class="timer-actions"><button class="btn btn-primary" id="start">Start timer</button><button class="btn btn-outline" id="reset">Reset</button></div></section><aside class="settings"><h2>Make it yours</h2><label for="activity">Activity name</label><input id="activity" maxlength="60" value="Quiet break"><label for="minutes">Duration (minutes)</label><input id="minutes" type="number" min="0.1" max="180" step="0.1" value="5"><div class="preset-row"><button data-minutes="1">1 min</button><button data-minutes="5">5 min</button><button data-minutes="10">10 min</button><button data-minutes="15">15 min</button></div><label for="theme">Color theme</label><select id="theme"><option value="mint">Meadow</option><option value="lavender">Lavender</option><option value="peach">Sunset</option></select><label class="check"><input type="checkbox" id="sound"> Gentle chime at the end</label><label class="check"><input type="checkbox" id="motion"> Smooth countdown motion</label><p class="small">Sound and motion are off to start. Keep this page open while the timer runs.</p><p id="timer-error" role="alert"></p></aside></div></section></main><div data-mount="footer"></div><script src="/js/layout.js"></script><script src="/js/nav.js"></script><script src="/js/timer.js"></script></body></html>
